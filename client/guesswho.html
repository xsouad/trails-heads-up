<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trails Guess Who</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="guesswho.css">
</head>
<body>

<div class="mode-switcher">
  <a class="mode-btn" href="/">Trails Heads Up</a>
  <a class="mode-btn active" href="/guesswho">Trails Guess Who</a>
  <a class="mode-btn" href="/wavelength">Trails Wavelength</a>
</div>

<div id="app-guesswho">
  <div id="gwNoticeBar"></div>

  <div class="screen active" id="gwScreen">
    <h1>Trails Guess Who</h1>
    <div id="gwTopBlurb">
      <p class="subtitle">Pick a secret character. Ask yes or no questions. Guess who they've got first.</p>
      <button type="button" id="gwHowToPlayBtn" class="how-to-play-link">How to Play</button>
    </div>

    <div id="gwRoot"></div>
  </div>
</div>

<!-- Avatar + name modal, opened right before Create/Join/Watch actually
     fires -- matches Wavelength's flow instead of showing the avatar
     builder up front on the home screen. -->
<div class="zoom-overlay" id="gwJoinModal">
  <div class="how-to-play-card">
    <button class="close-btn how-to-play-close" id="gwJoinModalCloseBtn">Close</button>
    <h2 id="gwJoinModalTitle">Create a Room</h2>
    <label style="display:block; text-align:center;">Your avatar</label>
    <div class="avatar-builder">
      <div class="avatar-stage" id="gwAvatarStage"></div>
      <div class="arrow-row">
        <button type="button" data-gwlayer="hat" data-gwdir="-1">&lt;</button>
        <span class="layer-label">Accessories</span>
        <button type="button" data-gwlayer="hat" data-gwdir="1">&gt;</button>
      </div>
      <div class="arrow-row">
        <button type="button" data-gwlayer="face" data-gwdir="-1">&lt;</button>
        <span class="layer-label">Face</span>
        <button type="button" data-gwlayer="face" data-gwdir="1">&gt;</button>
      </div>
      <div class="arrow-row">
        <button type="button" data-gwlayer="base" data-gwdir="-1">&lt;</button>
        <span class="layer-label">Color</span>
        <button type="button" data-gwlayer="base" data-gwdir="1">&gt;</button>
      </div>
      <button type="button" class="dice-btn" id="gwDiceBtn">Randomize</button>
    </div>
    <input id="gwModalNameInput" type="text" placeholder="Your name" maxlength="20" style="margin-top:14px;" />
    <div class="error-msg" id="gwJoinModalError"></div>
    <button type="button" class="primary" id="gwJoinModalConfirmBtn" style="margin-top:12px;">Create a Room</button>
  </div>
</div>

<div class="zoom-overlay" id="gwHowToPlayOverlay">
  <div class="how-to-play-card">
    <button class="close-btn how-to-play-close" id="gwHowToPlayCloseBtn">Close</button>
    <div class="how-to-play-viewer">
      <button class="how-to-play-arrow how-to-play-prev" id="gwHowToPlayPrevBtn" aria-label="Previous page">&lt;</button>
      <img id="gwHowToPlayImg" src="" alt="How to Play">
      <button class="how-to-play-arrow how-to-play-next" id="gwHowToPlayNextBtn" aria-label="Next page">&gt;</button>
    </div>
    <div class="how-to-play-pagecount" id="gwHowToPlayPageCount"></div>
  </div>
</div>

<script src="avatar-shared.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="guesswho.js"></script>
</body>
</html>
